<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4e8e9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
<title>README Reader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap">
<style>
  /* browser-style tab strip on top, one reading column with a contents panel beside it on wide screens */
  :root {
    --bg: #fbfbf9; --fg: #22262b; --muted: #555c64; --line: #e2e4e1; --edge: #8a9198; --code-bg: #f0f2ef; --accent: #2f6f8f;
    --chrome: #e4e8e9; --hover: #d5dbdd; --lift: rgb(20 30 40 / .18);
    --display: "Source Serif 4", Georgia, serif;
    --body: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #15181b; --fg: #e4e7ea; --muted: #9aa2ab; --line: #2b3035; --edge: #6b737b; --code-bg: #1e2226; --accent: #7cb7d4;
    --chrome: #0c0e10; --hover: #23282d; --lift: rgb(0 0 0 / .5); color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #15181b; --fg: #e4e7ea; --muted: #9aa2ab; --line: #2b3035; --edge: #6b737b; --code-bg: #1e2226; --accent: #7cb7d4;
    --chrome: #0c0e10; --hover: #23282d; --lift: rgb(0 0 0 / .5); color-scheme: dark }

  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 var(--body); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--chrome); }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* tab strip */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
  .tabbar { display: flex; align-items: flex-end; background: var(--chrome); padding: 8px var(--gutter-r) 0 var(--gutter-l); }
  #tabs { display: flex; gap: 2px; overflow-x: auto; min-width: 0; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { position: relative; display: flex; align-items: center; flex: 0 1 220px; min-width: 110px; height: 36px; border-radius: 8px 8px 0 0;
    color: var(--muted); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    transition: background .15s, color .15s, transform .18s var(--ease), box-shadow .15s; }
  .tab:hover { background: var(--hover); }
  .tab.on { background: var(--bg); color: var(--fg); }
  .tab { overflow: hidden; }
  .tab.leaving { pointer-events: none; }
  .tab.dragging { z-index: 2; overflow: visible; transition: background .15s, box-shadow .15s; background: var(--bg); color: var(--fg);
    box-shadow: 0 6px 18px var(--lift); border-radius: 8px; cursor: grabbing; }
  #tabs.settle .tab { transition: none; }
  /* where a tab dragged from another window will land */
  .tabbar { position: relative; }
  .drop-mark { position: absolute; bottom: 4px; width: 3px; height: 28px; border-radius: 2px; background: var(--accent); pointer-events: none; }
  .tabbar.drop-target { box-shadow: inset 0 0 0 2px var(--accent); }
  .tab-title { flex: 1; min-width: 0; height: 100%; padding: 0 4px 0 12px; border: 0; background: none; text-align: left;
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab-x { flex: none; width: 24px; height: 24px; margin-right: 6px; border: 0; border-radius: 50%; background: none; font-size: 16px; line-height: 1; }
  .tab-x:hover { background: var(--hover); color: var(--fg); }
  .tab.dirty .tab-title::before { content: "● "; color: var(--accent); }
  #edit-btn[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  #save-status { white-space: nowrap; }
  #save-status:empty { display: none; } /* an empty status still took a slot and doubled the gap between buttons */
  #editor { grid-column: 1 / -1; width: 100%; box-sizing: border-box; min-height: 70vh; resize: vertical; padding: 16px;
    font: 14px/1.6 var(--mono); color: var(--fg); background: var(--code-bg); border: 1px solid var(--edge); border-radius: 8px; tab-size: 2; }
  #editor:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  #new { flex: none; width: 30px; height: 30px; margin: 0 0 3px 4px; border: 0; border-radius: 50%; background: none; font-size: 20px; line-height: 1; color: var(--muted);
    transition: background .15s, color .15s, transform .25s var(--ease); }
  #new:hover { background: var(--hover); color: var(--fg); transform: rotate(90deg); }
  #new:active { transform: rotate(90deg) scale(.85); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px var(--gutter-r) 8px var(--gutter-l); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  #path { font-family: var(--mono); min-width: 0; overflow-wrap: anywhere; flex: 1; }
  .btn { border: 1px solid var(--edge); background: var(--bg); border-radius: 6px; padding: 4px 12px; font-size: 13px;
    transition: border-color .15s, transform .12s, background .15s; }
  .btn:hover { border-color: var(--muted); }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; padding: 10px 20px; font-size: 15px; }
  .btn.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px var(--lift); }

  /* page */
  .page { max-width: 1120px; margin: 0 auto; padding: 24px var(--gutter-r) 80px var(--gutter-l); display: grid; gap: 24px 48px; }
  .page.fade { animation: page-in .28s var(--ease); }
  @keyframes page-in { from { opacity: 0; transform: translateY(8px); } }
  @media (min-width: 1000px) { .page.has-toc { grid-template-columns: minmax(0, 1fr) 220px; } .toc { order: 2; position: sticky; top: 110px; align-self: start; } }
  .imgbar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 14px; border-radius: 8px;
    background: color-mix(in srgb, var(--accent) 10%, var(--bg)); font-size: 14px; }
  .imgbar span { flex: 1; min-width: 0; }
  .toc { font-size: 14px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; max-height: calc(100vh - 140px); overflow: auto; }
  .toc summary { font-weight: 600; cursor: pointer; }
  .toc[open] ul { animation: page-in .2s var(--ease); }
  .toc ul { list-style: none; margin: 8px 0 4px; padding: 0; display: grid; gap: 4px; }
  .toc a { color: var(--muted); text-decoration: none; transition: color .15s, padding .15s; }
  .toc a:hover { color: var(--accent); padding-left: 4px; }
  .toc .l3 { padding-left: 14px; }

  #out { min-width: 0; max-width: 72ch; overflow-wrap: anywhere; }
  #out h1, #out h2, #out h3, #out h4 { font-family: var(--display); font-weight: 600; line-height: 1.25; text-wrap: balance; margin: 1.6em 0 .5em; scroll-margin-top: 120px; }
  #out > :first-child { margin-top: 0; }
  #out h1 { font-size: 2.1em; }
  #out h2 { font-size: 1.45em; padding-bottom: .25em; border-bottom: 1px solid var(--line); }
  #out h3 { font-size: 1.15em; }
  #out .flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } }
  #out a { color: var(--accent); }
  #out code { font-family: var(--mono); font-size: .88em; background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }
  #out .code { position: relative; }
  #out pre { background: var(--code-bg); padding: 14px 16px; border-radius: 6px; overflow-x: auto; line-height: 1.5; }
  #out pre code { background: none; padding: 0; }
  #out .copy { position: absolute; top: 8px; right: 8px; opacity: 0; transition: opacity .15s; }
  /* shown on hover, or when tabbed to; touch screens can't hover, so there it stays visible */
  #out .code:hover .copy, #out .code:focus-within .copy { opacity: 1; }
  @media (hover: none) { #out .copy { opacity: 1; } }
  #out .copy.done { animation: pop .3s var(--ease); border-color: var(--accent); color: var(--accent); opacity: 1; }
  @keyframes pop { 50% { transform: scale(1.1); } }
  #out blockquote { margin: 0; padding-left: 16px; border-left: 3px solid var(--line); color: var(--muted); }
  #out .table { overflow-x: auto; }
  #out table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  #out th, #out td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; }
  #out hr { border: 0; border-top: 1px solid var(--line); }
  #out img { max-width: 100%; }

  /* new tab page */
  .start { grid-column: 1 / -1; display: grid; justify-items: center; gap: 16px; text-align: center; padding: 72px 24px; border: 2px dashed var(--line); border-radius: 16px;
    transition: border-color .2s, background .2s, transform .2s var(--ease); }
  body.dragging .start { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); transform: scale(1.01); }
  .start > * { animation: rise .45s var(--ease) both; }
  .start > :nth-child(2) { animation-delay: .06s; }
  .start > :nth-child(3) { animation-delay: .12s; }
  .start > :nth-child(4) { animation-delay: .18s; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  .start svg { width: 56px; height: 56px; color: var(--accent); }
  body.dragging .start svg { animation: bob .9s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .start h1 { font-family: var(--display); font-weight: 600; font-size: 2em; margin: 0; }
  .start p { margin: 0; color: var(--muted); max-width: 40ch; }

  /* drag overlay and messages */
  .drop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 85%, transparent);
    border: 3px dashed var(--accent); font: 600 1.4em var(--display); color: var(--accent); pointer-events: none;
    opacity: 0; transition: opacity .18s; }
  .drop.show { opacity: 1; }
  #toast { position: fixed; z-index: 30; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px);
    background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; pointer-events: none;
    opacity: 0; transform: translate(-50%, 16px); transition: opacity .2s, transform .25s var(--ease); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.show.actionable { pointer-events: auto; }
  .toast-act { margin-left: 12px; padding: 2px 4px; border: 0; background: none; color: inherit; font-weight: 600; text-decoration: underline; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="top">
  <div class="tabbar">
    <div id="tabs" role="tablist" aria-label="Open files"></div>
    <button id="new" aria-label="New tab" title="New tab">+</button>
  </div>
  <div class="toolbar">
    <span id="path"></span>
    <span id="stats"></span>
    <button class="btn" id="edit-btn" hidden>Edit</button>
    <span id="save-status" role="status"></span>
    <button class="btn" id="save-where" hidden></button>
    <button class="btn" id="open-btn">Open files</button>
  </div>
</div>

<div class="page" id="page">
  <details class="toc" id="toc" hidden><summary>Contents</summary><ul id="toc-list"></ul></details>
  <label class="sr" for="editor">File text</label>
  <textarea id="editor" spellcheck="false" hidden></textarea>
  <div class="imgbar" id="imgbar" role="status" hidden><span id="imgmsg"></span><button class="btn" id="imgbtn">Choose folder</button></div>
  <article id="out"></article>
  <section class="start" id="start" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9.5 14.5 12 17l2.5-2.5"/>
    </svg>
    <h1>Open a README</h1>
    <p>Choose one or more Markdown files, or drag them anywhere onto this window. Each file opens in its own tab.</p>
    <button class="btn primary" id="choose">Choose files</button>
  </section>
</div>

<label class="sr" for="file">Choose Markdown files</label>
<input class="sr" type="file" id="file" multiple accept=".md,.markdown,.mdx,.txt,text/markdown,text/plain">
<div class="drop" id="drop" aria-hidden="true">Drop to open in new tabs</div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = 'readme-reader-tabs';
const MAX_BYTES = 5e6;
const blank = () => ({ name: 'New tab', md: null });
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

let tabs = [], active = 0, shown = null;

// A window made by dragging a tab out has ?w=<id>. It keeps its tabs to itself (sessionStorage) so it never overwrites the main window's saved tabs.
const winId = new URLSearchParams(location.search).get('w');
const HANDOFF = 'readme-reader-handoff-';
const store = () => winId ? sessionStorage : localStorage;
const storeKey = winId ? KEY + ':' + winId : KEY;

function save() {
  try { store().setItem(storeKey, JSON.stringify({ tabs: tabs.map(({ name, md, dirty }) => ({ name, md, dirty })), active })); }
  catch { /* storage full or blocked: tabs just won't be restored */ }
}
function restore() {
  try {
    if (winId && !store().getItem(storeKey)) {
      const h = localStorage.getItem(HANDOFF + winId);
      localStorage.removeItem(HANDOFF + winId);
      if (h) { tabs = [JSON.parse(h)]; active = 0; return true; }
    }
    const s = JSON.parse(store().getItem(storeKey));
    if (s && Array.isArray(s.tabs) && s.tabs.length) { tabs = s.tabs; active = Math.min(s.active | 0, tabs.length - 1); return true; }
  } catch {}
  return false;
}

const slug = s => s.toLowerCase().trim().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '');

/* Tab elements are added, removed and moved one at a time, so the strip never rebuilds mid-animation.
   Closing tabs stay in the DOM while they shrink, so indexes skip them. */
const tabEls = () => [...$('tabs').querySelectorAll('.tab:not(.leaving)')];
const indexOf = el => tabEls().indexOf(el);
const ms = n => reduced() ? 0 : n;

function makeTab(t) {
  const tab = document.createElement('div');
  tab.className = 'tab';
  tab.onauxclick = e => { if (e.button === 1) { e.preventDefault(); closeTab(indexOf(tab)); } };
  tab.onpointerdown = e => tabDown(e, tab);
  tab.oncontextmenu = e => e.preventDefault();
  const title = document.createElement('button');
  title.className = 'tab-title';
  title.setAttribute('role', 'tab');
  title.onclick = () => { if (!justDragged) selectTab(indexOf(tab)); };
  const x = document.createElement('button');
  x.className = 'tab-x';
  x.textContent = '×';
  x.onclick = () => closeTab(indexOf(tab));
  tab.append(title, x);
  nameTab(tab, t.name);
  return tab;
}
function nameTab(tab, name) {
  tab.firstChild.textContent = tab.firstChild.title = name;
  tab.lastChild.setAttribute('aria-label', 'Close ' + name);
}
function addTabEl(t) {
  const tab = makeTab(t);
  $('tabs').append(tab);
  tab.animate([{ flexBasis: '0px', minWidth: '0px', opacity: 0 }, { flexBasis: '220px', minWidth: '110px', opacity: 1 }],
    { duration: ms(220), easing: 'cubic-bezier(.2, .8, .2, 1)' });
}
function syncActive() {
  tabEls().forEach((el, j) => {
    el.classList.toggle('on', j === active);
    el.classList.toggle('dirty', !!tabs[j]?.dirty);
    if (tabs[j]) el.firstChild.title = tabs[j].dirty ? `${tabs[j].name}: unsaved changes` : tabs[j].name;
    el.firstChild.setAttribute('aria-selected', j === active);
  });
  tabEls()[active]?.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: reduced() ? 'auto' : 'smooth' });
}

function renderDoc() {
  const t = tabs[active], isStart = t.md == null, page = $('page');
  if (t === shown) return;
  shown = t;
  page.classList.remove('fade'); void page.offsetWidth; page.classList.add('fade');
  $('start').hidden = !isStart;
  $('out').hidden = isStart || !!t.editing;
  $('editor').hidden = isStart || !t.editing;
  $('edit-btn').hidden = isStart;
  $('open-btn').hidden = !isStart;
  $('edit-btn').textContent = t.editing ? 'Done' : 'Edit';
  $('edit-btn').setAttribute('aria-pressed', !!t.editing);
  showSaveState(t);
  $('toc').hidden = true;
  page.classList.remove('has-toc');
  $('imgbar').hidden = true;
  blobUrls.forEach(URL.revokeObjectURL);
  blobUrls = [];
  $('path').textContent = isStart ? 'New tab' : t.name;
  document.title = isStart ? 'README Reader' : t.name;
  if (isStart) { $('stats').textContent = ''; return; }

  showStats(t);
  if (t.editing) { $('editor').value = t.md; return; }

  const out = $('out');
  // README content is untrusted, so sanitize the rendered HTML
  out.innerHTML = DOMPurify.sanitize(marked.parse(t.md));
  // Images with a relative path live in the file's folder; hold them back until that folder is chosen
  const local = [...out.querySelectorAll('img[src], source[srcset]')].filter(el => {
    const attr = el.tagName === 'IMG' ? 'src' : 'srcset', val = el.getAttribute(attr);
    if (/^([a-z][a-z0-9+.-]*:|\/\/|#)/i.test(val)) return false;
    el.dataset.local = val.trim().split(/\s+/)[0];
    el.removeAttribute(attr);
    return true;
  });
  showLocalImages(t, local);

  out.querySelectorAll('table').forEach(tb => { const w = document.createElement('div'); w.className = 'table'; tb.before(w); w.append(tb); });
  out.querySelectorAll('pre').forEach(pre => {
    const w = document.createElement('div'); w.className = 'code'; pre.before(w); w.append(pre);
    const b = document.createElement('button'); b.className = 'btn copy'; b.textContent = 'Copy';
    b.onclick = () => navigator.clipboard.writeText(pre.innerText)
      .then(() => { b.textContent = 'Copied'; b.classList.add('done'); setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('done'); }, 1500); })
      .catch(() => getSelection().selectAllChildren(pre));
    w.append(b);
  });
  out.querySelectorAll('a[href]').forEach(a => { if (!a.getAttribute('href').startsWith('#')) { a.target = '_blank'; a.rel = 'noopener'; } });

  const used = {}, list = $('toc-list');
  list.innerHTML = '';
  out.querySelectorAll('h1, h2, h3').forEach(h => {
    let id = 'h-' + slug(h.textContent);
    if (used[id]) id += '-' + used[id]++; else used[id] = 1;
    h.id = id;
    if (h.tagName === 'H1') return;
    const li = document.createElement('li'), a = document.createElement('a');
    li.className = h.tagName === 'H3' ? 'l3' : '';
    a.href = '#' + id.slice(2);
    a.textContent = h.textContent;
    li.append(a); list.append(li);
  });
  if (list.children.length >= 3) {
    $('toc').hidden = false;
    $('toc').open = matchMedia('(min-width: 1000px)').matches;
    page.classList.add('has-toc');
  }
}

function update() { syncActive(); renderDoc(); save(); }

function selectTab(i) {
  if (i === active || i < 0) return;
  tabs[active].scroll = scrollY;
  active = i;
  update();
  scrollTo(0, tabs[i].scroll || 0);
}
function removeTabData(i) {
  tabs.splice(i, 1);
  if (active > i || active >= tabs.length) active = Math.max(0, active - 1);
}
function closeTab(i) {
  const el = tabEls()[i];
  if (!el) return;
  const t = tabs[i];
  // A file with somewhere to go finishes saving first (closing the last tab closes the window, so the write has to land).
  // If that fails, the next click closes it with Undo.
  if (t.dirty && t.handle && !t.saveError) return autoSave(t).then(() => { if (!t.dirty) closeTab(tabs.indexOf(t)); });
  // Changes with nowhere to go: close anyway and offer Undo; a confirm() can be silently suppressed and leave the tab stuck
  const unsaved = t.dirty;
  removeTabData(i);
  el.classList.add('leaving');
  el.classList.remove('on');
  const anim = el.animate([{ flexBasis: el.offsetWidth + 'px', minWidth: '0px', opacity: 1 }, { flexBasis: '0px', minWidth: '0px', marginRight: '-2px', opacity: 0 }],
    { duration: ms(180), easing: 'ease-in', fill: 'forwards' });
  // onfinish never fires in a hidden page, so the timer makes sure the element goes
  anim.onfinish = () => el.remove();
  setTimeout(() => el.remove(), 300);
  afterRemove(unsaved);
  if (unsaved) toast(`Closed ${t.name} with unsaved changes.`, { label: 'Undo', fn: () => reopenTab(t) });
}
function reopenTab(t) {
  if (tabs.length === 1 && tabs[0].md == null) { tabs[0] = t; nameTab(tabEls()[0], t.name); active = 0; }
  else { tabs[active].scroll = scrollY; tabs.push(t); addTabEl(t); active = tabs.length - 1; }
  update();
}
// Shared by closing a tab and dragging it out to its own window.
// keepWindow: the closed tab can still be undone, so don't close the window under it.
function afterRemove(keepWindow) {
  if (!tabs.length && keepWindow) { tabs.push(blank()); addTabEl(tabs[0]); }
  if (!tabs.length) {
    save();
    window.close();
    // close() is refused for some windows (an ordinary browser tab, the claude.ai page); there, show an empty tab instead
    setTimeout(() => { if (!tabs.length) { tabs.push(blank()); addTabEl(tabs[0]); active = 0; update(); } }, 200);
    return;
  }

  update();
  if (switched) scrollTo(0, tabs[active].scroll || 0);
}
function newTab() {
  tabs[active].scroll = scrollY;
  tabs.push(blank());
  addTabEl(tabs.at(-1));
  active = tabs.length - 1;
  update();
  scrollTo(0, 0);
}

function toast(msg, action) {
  const t = $('toast');
  t.replaceChildren(msg);
  if (action) {
    const b = document.createElement('button');
    b.className = 'toast-act';
    b.textContent = action.label;
    b.onclick = () => { t.classList.remove('show'); action.fn(); };
    t.append(b);
  }
  t.classList.toggle('actionable', !!action);
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), action ? 8000 : 4000);
}

// The first file replaces a blank "New tab"; the rest open as new tabs.
async function openFiles(files) {
  const skipped = [];
  let opened = 0;
  for (const f of files) {
    if (!/\.(md|markdown|mdx|txt)$/i.test(f.name) && !f.type.startsWith('text/')) { skipped.push(`${f.name} isn't a Markdown or text file`); continue; }
    if (f.size > MAX_BYTES) { skipped.push(`${f.name} is over 5 MB`); continue; }
    const tab = { name: f.name, md: await f.text(), handle: f.handle };
    if (tabs[active]?.md == null) { tabs[active] = tab; nameTab(tabEls()[active], tab.name); }
    else { tabs[active].scroll = scrollY; tabs.push(tab); addTabEl(tab); active = tabs.length - 1; }
    opened++;
  }
  if (opened) { update(); scrollTo(0, 0); }
  if (skipped.length) toast('Skipped: ' + skipped.join('; '));
}

/* Reorder tabs. Touch: hold, then slide (so a quick swipe still scrolls the strip).

  const c = mids[i] + dx;

  // swap once the dragged tab passes halfway into the next slot; comparing to the slot's centre made the end slots unreachable
  while (to < els.length - 1 && c > (mids[to] + mids[to + 1]) / 2) to++;
  while (to > 0 && c < (mids[to - 1] + mids[to]) / 2) to--;

  els.forEach((el, j) => {
    if (j !== i) el.style.transform = j > i && j <= to ? `translateX(${-w}px)` : j < i && j >= to ? `translateX(${w}px)` : '';

// A mouse-dragged tab that leaves the strip closes its gap, the way a browser's does

  drag.x = e.clientX;
  drag.y = e.clientY;

  if (drag.on) moveDrag();

function finishReorder(d) {

  if (d.to > d.i) d.els[d.to].after(d.el); else if (d.to < d.i) d.els[d.to].before(d.el);

  tabs.splice(d.to, 0, tabs.splice(d.i, 1)[0]);

// The tab's file goes to the new window through localStorage, which both windows share; the new window removes it on arrival.
function openInNewWindow(t, left, top) {
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  try { localStorage.setItem(HANDOFF + id, JSON.stringify({ name: t.name, md: t.md })); }
  catch { toast("Couldn't move the tab to a new window."); return false; }
  const w = window.open(location.pathname + '?w=' + id, '_blank',
    `popup,width=${Math.round(outerWidth * .75)},height=${Math.round(outerHeight * .85)},left=${Math.round(left)},top=${Math.round(top)}`);
  if (w) return true;
  localStorage.removeItem(HANDOFF + id);

const slotAt = x => tabEls().filter(el => { const r = el.getBoundingClientRect(); return r.left + r.width / 2 < x; }).length;

// A file handle can't ride inside a drag, so it follows over this channel and the tab keeps saving to the same file
const bc = 'BroadcastChannel' in window ? new BroadcastChannel('readme-reader-windows') : null;
const arrived = new Map();
if (bc) bc.onmessage = ({ data: m }) => {
  const t = arrived.get(m.req);
  arrived.delete(m.req);
  if (t && m.handle) { t.handle = m.handle; showSaveState(t); }
};
{
  const bar = $('tabs').parentElement, isTab = e => e.dataTransfer.types.includes(TAB_TYPE);
  $('tabs').addEventListener('dragstart', e => {
    const el = e.target.closest?.('.tab');
    if (!el) return;
    const els = tabEls(), i = indexOf(el), t = tabs[i], r = el.getBoundingClientRect();
    drag = { native: true, on: true, el, els, i, to: i, x0: e.clientX, x: e.clientX, ox: e.clientX - r.left, oy: e.clientY - r.top,
      mids: els.map(el => { const r = el.getBoundingClientRect(); return r.left + r.width / 2; }), w: r.width + 2,
      req: Math.random().toString(36).slice(2) };
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData(TAB_TYPE, JSON.stringify({ req: drag.req, name: t.name, md: t.md, dirty: t.dirty }));
    el.classList.add('dragging');
    e.dataTransfer.setDragImage(el, drag.ox, drag.oy);

    d.el.style.visibility = '';
    d.el.classList.remove('dragging');
    void strip.offsetWidth;
    strip.classList.remove('settle');

addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);
$('tabs').addEventListener('touchmove', e => { if (drag?.on) e.preventDefault(); }, { passive: false });

$('new').onclick = newTab;
// The file picker hands back file handles, which is what lets Save write to the same file later
const withHandle = async h => Object.assign(await h.getFile(), { handle: h });
$('open-btn').onclick = $('choose').onclick = async () => {
  if (!('showOpenFilePicker' in window)) return $('file').click();
  try {
    const hs = await showOpenFilePicker({ multiple: true, types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.mdx'], 'text/plain': ['.txt'] } }] });
    openFiles(await Promise.all(hs.map(withHandle)));
  } catch (e) { if (e.name !== 'AbortError') $('file').click(); }
};

/* Editing */
function showStats(t) {
  const words = t.md.split(/\s+/).filter(Boolean).length;
  $('stats').textContent = `${words.toLocaleString()} words · ${Math.max(1, Math.round(words / 230))} min read`;
}
$('edit-btn').onclick = () => {
  const t = tabs[active];
  t.editing = !t.editing;
  shown = null;
  renderDoc();
  if (!t.editing) return;
  $('editor').focus();
  // ask for permission to write now, while the click still counts as the user's own action
  t.handle?.requestPermission?.({ mode: 'readwrite' }).catch(() => {});
};

/* Auto-save: edits are written to the file shortly after you stop typing.
   Without a file to write to (a restored tab, or a browser with no file access) they are kept in the app until you choose a place. */
const canPickFiles = 'showSaveFilePicker' in window;
let saveTimer;
$('editor').oninput = () => {
  const t = tabs[active];
  t.md = $('editor').value;
  t.dirty = true;
  t.saveError = null;
  syncActive();
  showStats(t);
  showSaveState(t);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => autoSave(t), 700);
};
async function autoSave(t) {
  clearTimeout(saveTimer);
  save();
  if (!t.dirty || !t.handle) return showSaveState(t);
  t.saving = true;
  showSaveState(t);
  try {
    const w = await t.handle.createWritable();
    await w.write(t.md);
    await w.close();
    t.dirty = false;
  } catch (e) {
    t.saveError = e.name === 'NotAllowedError' ? 'Saving to the file isn\'t allowed' : `Couldn't save: ${e.message}`;
  }
  t.saving = false;
  syncActive();
  save();
  showSaveState(t);
}
function showSaveState(t) {
  if (tabs[active] !== t) return;
  const s = $('save-status'), b = $('save-where');
  b.hidden = true;
  if (t.md == null || (!t.editing && !t.dirty)) return s.textContent = '';
  if (t.saving) return s.textContent = 'Saving…';
  if (!t.dirty) return s.textContent = 'Saved';
  if (t.saveError) { s.textContent = t.saveError; b.textContent = 'Allow saving'; }
  else if (!t.handle) { s.textContent = ''; b.textContent = canPickFiles ? 'Save copy' : 'Download a copy'; }
  else return s.textContent = 'Saving…';
  b.hidden = false;
}
$('save-where').onclick = async () => {
  const t = tabs[active];
  try {
    if (t.handle) await t.handle.requestPermission?.({ mode: 'readwrite' });
    else if (canPickFiles) {
      t.handle = await showSaveFilePicker({ suggestedName: t.name, types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown'] } }] });
      t.name = t.handle.name;
      nameTab(tabEls()[active], t.name);
      $('path').textContent = t.name;
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([t.md], { type: 'text/markdown' }));
      a.download = t.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      return toast(`Downloaded a copy of ${t.name}`);
    }
  } catch (e) {
    if (e.name !== 'AbortError') toast(`Couldn't choose a place to save: ${e.message}`);
    return;
  }
  t.saveError = null;
  autoSave(t);
};
// Ctrl+S saves right away instead of waiting for the pause
addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && tabs[active]?.md != null) {
    e.preventDefault();
    const t = tabs[active];
    if (!t.handle && t.dirty) $('save-where').click(); else autoSave(t);
  }
});
addEventListener('beforeunload', e => { if (tabs.some(t => t.dirty)) e.preventDefault(); });
$('file').onchange = e => { openFiles([...e.target.files]); e.target.value = ''; };

/* Images saved next to a file. A web page can't read a folder on its own, so the reader asks for it once per tab.
   shortcut: the folder isn't remembered after the app restarts, so the bar asks again; storing handles in IndexedDB would fix that. */
let blobUrls = [];
async function fileAt(dir, path) {
  const parts = decodeURIComponent(path.split(/[?#]/)[0]).split('/').filter(p => p && p !== '.');
  if (!parts.length || parts.includes('..')) throw new Error('outside folder');
  for (const p of parts.slice(0, -1)) dir = await dir.getDirectoryHandle(p);
  return (await dir.getFileHandle(parts.at(-1))).getFile();
}
async function showLocalImages(t, els) {
  if (!els.length) return;
  const n = els.filter(el => el.tagName === 'IMG').length || els.length;
  if (!t.dir) {
    const canPick = 'showDirectoryPicker' in window;
    $('imgmsg').textContent = canPick
      ? `This file has ${n} image${n > 1 ? 's' : ''} stored in its project folder. Choose that folder to show ${n > 1 ? 'them' : 'it'}.`
      : `This file has ${n} image${n > 1 ? 's' : ''} saved next to it, which this browser can't show. Use README Reader in Edge or Chrome on a computer.`;
    $('imgbtn').hidden = !canPick;
    $('imgbar').hidden = false;
    return;
  }
  let missing = 0;
  await Promise.all(els.map(async el => {
    try {
      const url = URL.createObjectURL(await fileAt(t.dir, el.dataset.local));
      blobUrls.push(url);
      el.setAttribute(el.tagName === 'IMG' ? 'src' : 'srcset', url);
    } catch { missing++; }
  }));
  if (missing === els.length) toast(`None of the images are in "${t.dir.name}". Choose the project folder that has them (for example the one with a "${els[0].dataset.local.split('/')[0]}" folder).`);
  else if (missing) toast(`${missing} image${missing > 1 ? 's' : ''} couldn't be found in "${t.dir.name}".`);
  if (missing === els.length) { t.dir = null; shown = null; renderDoc(); }
}
$('imgbtn').onclick = async () => {
  const t = tabs[active];
  try { t.dir = await showDirectoryPicker({ id: 'readme-folder', ...(t.handle && { startIn: t.handle }) }); }
  catch (e) { if (e.name !== 'AbortError') toast("Folders can't be opened here. Use the installed README Reader app."); return; }
  shown = null;
  renderDoc();
};

// Links inside a file (#section) scroll to the matching heading.
document.addEventListener('click', e => {
  const a = e.target.closest('#out a[href^="#"], .toc a');
  if (!a) return;
  e.preventDefault();
  const target = $('h-' + slug(decodeURIComponent(a.getAttribute('href').slice(1))));
  if (!target) return;
  target.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth' });
  target.classList.remove('flash'); void target.offsetWidth; target.classList.add('flash');
});

let dragDepth = 0;
const showDrop = on => { $('drop').classList.toggle('show', on); document.body.classList.toggle('dragging', on); };
addEventListener('dragenter', e => { if (e.dataTransfer.types.includes('Files')) { dragDepth++; showDrop(true); } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; showDrop(false); } });

  e.preventDefault();

  // Both lists have to be read now, before the drop event ends
  const items = [...e.dataTransfer.items].filter(i => i.kind === 'file');
  const files = items.map(i => i.getAsFile());

    .then(hs => openFiles(files.map((f, k) => hs[k]?.kind === 'file' ? Object.assign(f, { handle: hs[k] }) : f)))

});

if (!restore()) tabs = [blank()];
// Earlier versions saved an example tab; drop it.
tabs = tabs.filter(t => t.name !== 'Example README.md');
if (!tabs.length) tabs = [blank()];

tabs.forEach(t => $('tabs').append(makeTab(t)));

// The file handle is kept so the folder picker can start in that file's folder
if ('launchQueue' in window) launchQueue.setConsumer(p => {
  if (p.files.length) Promise.all(p.files.map(withHandle)).then(openFiles);
});
